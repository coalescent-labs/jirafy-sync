name: Jirafy Sync

on:
  push:
    tags:
      - 'v*.*.*' # i.e. v1.0.0; not the moving major tag (v1)
      - '!v*-*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repo has tags but no prior GitHub release to diff from
      - name: Previous tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' "${{ github.sha }}^")" >> "$GITHUB_OUTPUT"

      - name: Jirafy Changelog
        id: changelog
        uses: coalescent-labs/jirafy-changelog@v4
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jiraHost: ${{ secrets.JIRA_HOST }}
          head-ref: ${{ github.ref_name }}
          base-ref: ${{ steps.previous.outputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Jirafy Sync
        uses: ./
        with:
          changelog: ${{ steps.changelog.outputs.changelog }}
          jiraVersion: ${{ github.ref_name }}
          jiraHost: ${{ secrets.JIRA_HOST }}
          jiraUsername: ${{ secrets.JIRA_USERNAME }}
          jiraToken: ${{ secrets.JIRA_TOKEN }}

      # Consumers use the major tag (i.e. @v4): point it at this release
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
